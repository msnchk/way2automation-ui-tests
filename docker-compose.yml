version: '3.8'

networks:
  selenoid:
    external: true  #docker network create selenoid

services:
  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    networks:
      - selenoid
    ports:
      - "4444:4444"
    volumes:
      - ./selenoid:/etc/selenoid
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/video:/opt/selenoid/video
      - ./selenoid/logs:/opt/selenoid/logs
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
    command:
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-video-output-dir"
      - "/opt/selenoid/video"
      - "-log-output-dir"
      - "/opt/selenoid/logs"
      - "-limit"
      - "2"
      - "-timeout"
      - "2m"
      - "-container-network"
      - "selenoid"

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    networks:
      - selenoid
    ports:
      - "8081:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid

  tests:
    build: .
    container_name: tests
    networks:
      - selenoid
    depends_on:
      - selenoid
    environment:
      - executionType=remote
    volumes:
      - ~/.m2:/root/.m2
      - ./allure-results:/app/target/allure-results
      - ./allure-report:/app/allure-report